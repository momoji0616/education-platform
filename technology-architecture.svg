<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 32px SimSun, "Microsoft YaHei", serif; fill: #111111; }
      .subtitle { font: 400 18px SimSun, "Microsoft YaHei", serif; fill: #333333; }
      .node-title { font: 700 22px SimSun, "Microsoft YaHei", serif; fill: #111111; }
      .node-text { font: 400 18px SimSun, "Microsoft YaHei", serif; fill: #111111; }
      .small-text { font: 400 16px SimSun, "Microsoft YaHei", serif; fill: #111111; }
      .box { fill: #ffffff; stroke: #222222; stroke-width: 2; }
      .line { stroke: #222222; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>

  <text x="80" y="80" class="title">技术架构图</text>
  <text x="80" y="115" class="subtitle">教育平台整体技术架构</text>

  <rect x="620" y="150" width="360" height="90" class="box"/>
  <text x="800" y="188" text-anchor="middle" class="node-title">用户访问层</text>
  <text x="800" y="220" text-anchor="middle" class="node-text">管理端 / 教师端 / 学生端</text>

  <rect x="540" y="300" width="520" height="100" class="box"/>
  <text x="800" y="342" text-anchor="middle" class="node-title">前端表现层</text>
  <text x="800" y="376" text-anchor="middle" class="node-text">Vue + Vue Router + Element Plus</text>

  <rect x="500" y="470" width="600" height="110" class="box"/>
  <text x="800" y="514" text-anchor="middle" class="node-title">业务服务层</text>
  <text x="800" y="550" text-anchor="middle" class="node-text">Spring Boot + MyBatis + 权限控制 + 接口编排</text>

  <rect x="90" y="700" width="380" height="160" class="box"/>
  <text x="280" y="745" text-anchor="middle" class="node-title">业务数据库</text>
  <text x="280" y="785" text-anchor="middle" class="node-text">MySQL</text>
  <text x="280" y="820" text-anchor="middle" class="small-text">用户、课程、模块、题库、答题记录、成绩</text>

  <rect x="610" y="680" width="380" height="200" class="box"/>
  <text x="800" y="725" text-anchor="middle" class="node-title">核心业务模块</text>
  <text x="800" y="765" text-anchor="middle" class="small-text">用户与权限管理</text>
  <text x="800" y="800" text-anchor="middle" class="small-text">学生管理 / 学情分析 / 智能组卷</text>
  <text x="800" y="835" text-anchor="middle" class="small-text">成绩管理 / AI问答接口编排</text>

  <rect x="1130" y="700" width="380" height="160" class="box"/>
  <text x="1320" y="745" text-anchor="middle" class="node-title">AI 服务层</text>
  <text x="1320" y="785" text-anchor="middle" class="node-text">FastAPI</text>
  <text x="1320" y="820" text-anchor="middle" class="small-text">RAG 智能问答 / 成绩预测 / 学习建议</text>

  <rect x="1130" y="320" width="360" height="90" class="box"/>
  <text x="1310" y="358" text-anchor="middle" class="node-title">知识库检索</text>
  <text x="1310" y="390" text-anchor="middle" class="small-text">Excel 知识库 / 检索匹配 / 个性化上下文</text>

  <rect x="1130" y="470" width="360" height="90" class="box"/>
  <text x="1310" y="508" text-anchor="middle" class="node-title">智能分析模块</text>
  <text x="1310" y="540" text-anchor="middle" class="small-text">成绩预测 / 推荐分析 / 学习画像</text>

  <line x1="800" y1="240" x2="800" y2="300" class="line" marker-end="url(#arrow)"/>
  <line x1="800" y1="400" x2="800" y2="470" class="line" marker-end="url(#arrow)"/>
  <line x1="670" y1="580" x2="360" y2="700" class="line" marker-end="url(#arrow)"/>
  <line x1="800" y1="580" x2="800" y2="680" class="line" marker-end="url(#arrow)"/>
  <line x1="930" y1="580" x2="1240" y2="700" class="line" marker-end="url(#arrow)"/>
  <line x1="1100" y1="510" x2="1130" y2="510" class="line" marker-end="url(#arrow)"/>
  <line x1="1100" y1="500" x2="1210" y2="410" class="line" marker-end="url(#arrow)"/>
</svg>
