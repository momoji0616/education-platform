<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #222; }
      .text { font: 500 20px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #222; }
      .box { fill: #ffffff; stroke: #555; stroke-width: 2.2; }
      .line { stroke: #555; stroke-width: 2.2; fill: none; }
      .arrow { fill: #555; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="arrow"/>
    </marker>
  </defs>
  <rect width="1200" height="1500" fill="#fff"/>
  <text x="600" y="48" text-anchor="middle" class="title">图3-3 RAG智能问答功能流程图</text>

  <rect x="360" y="90" width="480" height="68" class="box"/>
  <text x="600" y="133" text-anchor="middle" class="text">用户上传课程资料 / 导入前序数据</text>
  <path d="M600 158 L600 188" class="line" marker-end="url(#arrow)"/>

  <rect x="410" y="188" width="380" height="68" class="box"/>
  <text x="600" y="231" text-anchor="middle" class="text">系统解析文本内容</text>
  <path d="M600 256 L600 286" class="line" marker-end="url(#arrow)"/>

  <rect x="390" y="286" width="420" height="68" class="box"/>
  <text x="600" y="329" text-anchor="middle" class="text">文本切分与结构化处理</text>
  <path d="M600 354 L600 384" class="line" marker-end="url(#arrow)"/>

  <rect x="390" y="384" width="420" height="68" class="box"/>
  <text x="600" y="427" text-anchor="middle" class="text">向量化并写入知识库</text>
  <path d="M600 452 L600 482" class="line" marker-end="url(#arrow)"/>

  <rect x="460" y="482" width="280" height="68" class="box"/>
  <text x="600" y="525" text-anchor="middle" class="text">用户输入问题</text>
  <path d="M600 550 L600 580" class="line" marker-end="url(#arrow)"/>

  <rect x="410" y="580" width="380" height="68" class="box"/>
  <text x="600" y="623" text-anchor="middle" class="text">提取当前问题特征</text>
  <path d="M600 648 L600 678" class="line" marker-end="url(#arrow)"/>

  <rect x="380" y="678" width="440" height="68" class="box"/>
  <text x="600" y="721" text-anchor="middle" class="text">检索知识库相关片段</text>
  <path d="M600 746 L600 776" class="line" marker-end="url(#arrow)"/>

  <rect x="320" y="776" width="560" height="68" class="box"/>
  <text x="600" y="819" text-anchor="middle" class="text">结合学生 / 教师当前场景上下文</text>
  <path d="M600 844 L600 874" class="line" marker-end="url(#arrow)"/>

  <rect x="390" y="874" width="420" height="68" class="box"/>
  <text x="600" y="917" text-anchor="middle" class="text">构造增强提示词</text>
  <path d="M600 942 L600 972" class="line" marker-end="url(#arrow)"/>

  <rect x="340" y="972" width="520" height="68" class="box"/>
  <text x="600" y="1015" text-anchor="middle" class="text">调用大语言模型生成回答</text>
  <path d="M600 1040 L600 1070" class="line" marker-end="url(#arrow)"/>

  <rect x="410" y="1070" width="380" height="68" class="box"/>
  <text x="600" y="1113" text-anchor="middle" class="text">返回问答结果</text>
  <path d="M600 1138 L600 1168" class="line" marker-end="url(#arrow)"/>

  <rect x="410" y="1168" width="380" height="68" class="box"/>
  <text x="600" y="1211" text-anchor="middle" class="text">保存历史对话</text>
</svg>
