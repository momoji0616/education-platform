<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1f2937; }
      .subtitle { font: 400 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #5b6b7f; }
      .box-title { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #0f172a; }
      .box-text { font: 400 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #334155; }
      .small-text { font: 400 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #d9e3ee; stroke-width: 2; rx: 24; ry: 24; }
      .accent { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 24; ry: 24; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 24; ry: 24; }
      .yellow { fill: #fffbeb; stroke: #fbbf24; stroke-width: 2; rx: 24; ry: 24; }
      .purple { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; rx: 24; ry: 24; }
      .line { stroke: #6b7280; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#f7fafc"/>
  <rect x="40" y="30" width="1520" height="920" rx="30" ry="30" fill="#f8fbfd" stroke="#e2e8f0" stroke-width="2"/>

  <text x="80" y="95" class="title">教育平台技术架构图</text>
  <text x="80" y="130" class="subtitle">前后端分离 + AI 服务解耦 + 多角色教学业务协同</text>

  <rect x="620" y="170" width="360" height="92" class="accent"/>
  <text x="800" y="208" text-anchor="middle" class="box-title">用户访问层</text>
  <text x="800" y="238" text-anchor="middle" class="box-text">管理端 / 教师端 / 学生端</text>

  <rect x="560" y="320" width="480" height="108" class="blue"/>
  <text x="800" y="364" text-anchor="middle" class="box-title">前端表现层</text>
  <text x="800" y="398" text-anchor="middle" class="box-text">Vue + Vue Router + Element Plus</text>

  <rect x="520" y="500" width="560" height="118" class="accent"/>
  <text x="800" y="546" text-anchor="middle" class="box-title">业务服务层</text>
  <text x="800" y="582" text-anchor="middle" class="box-text">Spring Boot + MyBatis + 权限控制 + 接口编排</text>

  <rect x="130" y="710" width="420" height="170" class="yellow"/>
  <text x="340" y="755" text-anchor="middle" class="box-title">业务数据库</text>
  <text x="340" y="792" text-anchor="middle" class="box-text">MySQL</text>
  <text x="340" y="825" text-anchor="middle" class="small-text">用户、课程、模块、题库、答题记录、成绩等</text>

  <rect x="590" y="690" width="420" height="210" class="card"/>
  <text x="800" y="734" text-anchor="middle" class="box-title">核心业务模块</text>
  <text x="800" y="772" text-anchor="middle" class="small-text">用户与权限管理</text>
  <text x="800" y="804" text-anchor="middle" class="small-text">学生管理 / 学情分析 / 智能组卷</text>
  <text x="800" y="836" text-anchor="middle" class="small-text">成绩管理 / AI问答接口编排</text>

  <rect x="1050" y="710" width="420" height="170" class="purple"/>
  <text x="1260" y="755" text-anchor="middle" class="box-title">AI 服务层</text>
  <text x="1260" y="792" text-anchor="middle" class="box-text">FastAPI</text>
  <text x="1260" y="825" text-anchor="middle" class="small-text">RAG 智能问答 / 成绩预测 / 学习建议</text>

  <rect x="1110" y="400" width="300" height="110" class="card"/>
  <text x="1260" y="442" text-anchor="middle" class="box-title">知识库检索</text>
  <text x="1260" y="478" text-anchor="middle" class="small-text">Excel 知识库 / 检索匹配 / 个性化上下文</text>

  <rect x="1110" y="540" width="300" height="110" class="card"/>
  <text x="1260" y="582" text-anchor="middle" class="box-title">智能分析</text>
  <text x="1260" y="618" text-anchor="middle" class="small-text">成绩预测 / 推荐分析 / 学习画像</text>

  <line x1="800" y1="262" x2="800" y2="320" class="line" marker-end="url(#arrow)"/>
  <line x1="800" y1="428" x2="800" y2="500" class="line" marker-end="url(#arrow)"/>
  <line x1="660" y1="618" x2="420" y2="710" class="line" marker-end="url(#arrow)"/>
  <line x1="800" y1="618" x2="800" y2="690" class="line" marker-end="url(#arrow)"/>
  <line x1="940" y1="618" x2="1180" y2="710" class="line" marker-end="url(#arrow)"/>
  <line x1="1080" y1="560" x2="1110" y2="560" class="line" marker-end="url(#arrow)"/>
  <line x1="1080" y1="540" x2="1170" y2="510" class="line" marker-end="url(#arrow)"/>

</svg>
