<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <pattern id="smallGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e9edf2" stroke-width="1"/>
    </pattern>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#smallGrid)"/>
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#dfe6ee" stroke-width="1.2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#9fb2c7" flood-opacity="0.28"/>
    </filter>
    <style>
      .table-title { font: 700 17px "Microsoft YaHei", SimSun, sans-serif; fill: #ffffff; }
      .field { font: 400 13px "Microsoft YaHei", Consolas, monospace; fill: #1f2937; }
      .type { fill: #9a9a9a; }
      .pk-icon { fill: #d7a018; font: 400 14px "Microsoft YaHei", sans-serif; }
      .fk-icon { fill: #bfc5cc; font: 400 14px "Microsoft YaHei", sans-serif; }
      .table-border { fill: #ffffff; stroke: #3c84c6; stroke-width: 2.8; }
      .table-head { fill: #3f86c6; }
      .line { stroke: #4b5563; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1800" height="980" fill="url(#grid)"/>

  <g transform="translate(70,120)" filter="url(#shadow)">
    <rect class="table-border" width="340" height="170" rx="18"/>
    <path class="table-head" d="M18,0 h304 a18,18 0 0 1 18,18 v32 h-340 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="170" y="31" text-anchor="middle" class="table-title">sys_user</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> user_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field">user_name <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="132" class="field">nick_name <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="159" class="field">status <tspan class="type">: char(1)</tspan></text>
  </g>

  <g transform="translate(70,420)" filter="url(#shadow)">
    <rect class="table-border" width="380" height="220" rx="18"/>
    <path class="table-head" d="M18,0 h344 a18,18 0 0 1 18,18 v32 h-380 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="190" y="31" text-anchor="middle" class="table-title">edu_user_class_profile</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field"><tspan class="fk-icon">◇</tspan> user_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="132" class="field">role_key <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="159" class="field">grade_no <tspan class="type">: int(0)</tspan></text>
    <text x="18" y="186" class="field">class_no <tspan class="type">: int(0)</tspan></text>
    <text x="18" y="213" class="field">class_name <tspan class="type">: varchar(255)</tspan></text>
  </g>

  <g transform="translate(620,120)" filter="url(#shadow)">
    <rect class="table-border" width="360" height="240" rx="18"/>
    <path class="table-head" d="M18,0 h324 a18,18 0 0 1 18,18 v32 h-360 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="180" y="31" text-anchor="middle" class="table-title">edu_question_catalog</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field">catalog_code <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="132" class="field">catalog_name <tspan class="type">: varchar(255)</tspan></text>
    <text x="18" y="159" class="field">course_name <tspan class="type">: varchar(255)</tspan></text>
    <text x="18" y="186" class="field">chapter_code <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="213" class="field">chapter_name <tspan class="type">: varchar(255)</tspan></text>
  </g>

  <g transform="translate(620,460)" filter="url(#shadow)">
    <rect class="table-border" width="420" height="300" rx="18"/>
    <path class="table-head" d="M18,0 h384 a18,18 0 0 1 18,18 v32 h-420 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="210" y="31" text-anchor="middle" class="table-title">edu_question_bank</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field"><tspan class="fk-icon">◇</tspan> catalog_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="132" class="field">question_code <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="159" class="field">question_type <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="186" class="field">course_name <tspan class="type">: varchar(255)</tspan></text>
    <text x="18" y="213" class="field">chapter_code <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="240" class="field">chapter_name <tspan class="type">: varchar(255)</tspan></text>
    <text x="18" y="267" class="field">question_stem <tspan class="type">: longtext</tspan></text>
    <text x="18" y="294" class="field">options_json <tspan class="type">: longtext</tspan></text>
  </g>

  <g transform="translate(1180,460)" filter="url(#shadow)">
    <rect class="table-border" width="400" height="290" rx="18"/>
    <path class="table-head" d="M18,0 h364 a18,18 0 0 1 18,18 v32 h-400 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="200" y="31" text-anchor="middle" class="table-title">edu_student_answer_record</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field">student_no <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="132" class="field"><tspan class="fk-icon">◇</tspan> question_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="159" class="field">question_type <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="186" class="field">assignment_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="213" class="field">answer_content <tspan class="type">: longtext</tspan></text>
    <text x="18" y="240" class="field">score <tspan class="type">: decimal(10,2)</tspan></text>
    <text x="18" y="267" class="field">submit_time <tspan class="type">: datetime(0)</tspan></text>
  </g>

  <path d="M410 205 L620 205" class="line" marker-end="url(#arrow)"/>
  <path d="M260 290 L260 420" class="line" marker-end="url(#arrow)"/>
  <path d="M800 360 L800 460" class="line" marker-end="url(#arrow)"/>
  <path d="M1040 605 L1180 605" class="line" marker-end="url(#arrow)"/>
</svg>
