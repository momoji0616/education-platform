<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #222; }
      .text { font: 500 20px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #222; }
      .box { fill: #ffffff; stroke: #555; stroke-width: 2.2; }
      .line { stroke: #555; stroke-width: 2.2; fill: none; }
      .arrow { fill: #555; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="arrow"/>
    </marker>
  </defs>
  <rect width="1200" height="1500" fill="#fff"/>
  <text x="600" y="48" text-anchor="middle" class="title">图3-4 学业成绩预测算法流程图</text>

  <rect x="390" y="90" width="420" height="68" class="box"/>
  <text x="600" y="133" text-anchor="middle" class="text">导入学生成绩与行为数据</text>
  <path d="M600 158 L600 188" class="line" marker-end="url(#arrow)"/>

  <rect x="390" y="188" width="420" height="68" class="box"/>
  <text x="600" y="231" text-anchor="middle" class="text">数据清洗与缺失值处理</text>
  <path d="M600 256 L600 286" class="line" marker-end="url(#arrow)"/>

  <rect x="410" y="286" width="380" height="68" class="box"/>
  <text x="600" y="329" text-anchor="middle" class="text">特征提取与编码</text>
  <path d="M600 354 L600 384" class="line" marker-end="url(#arrow)"/>

  <rect x="380" y="384" width="440" height="68" class="box"/>
  <text x="600" y="427" text-anchor="middle" class="text">划分训练集与测试集</text>
  <path d="M600 452 L600 482" class="line" marker-end="url(#arrow)"/>

  <rect x="330" y="482" width="540" height="68" class="box"/>
  <text x="600" y="525" text-anchor="middle" class="text">构建 TensorFlow / Keras 预测模型</text>
  <path d="M600 550 L600 580" class="line" marker-end="url(#arrow)"/>

  <rect x="360" y="580" width="480" height="68" class="box"/>
  <text x="600" y="623" text-anchor="middle" class="text">模型训练与参数优化</text>
  <path d="M600 648 L600 678" class="line" marker-end="url(#arrow)"/>

  <rect x="430" y="678" width="340" height="68" class="box"/>
  <text x="600" y="721" text-anchor="middle" class="text">保存训练模型</text>
  <path d="M600 746 L600 776" class="line" marker-end="url(#arrow)"/>

  <rect x="390" y="776" width="420" height="68" class="box"/>
  <text x="600" y="819" text-anchor="middle" class="text">输入用户预测参数</text>
  <path d="M600 844 L600 874" class="line" marker-end="url(#arrow)"/>

  <rect x="380" y="874" width="440" height="68" class="box"/>
  <text x="600" y="917" text-anchor="middle" class="text">加载模型进行推理</text>
  <path d="M600 942 L600 972" class="line" marker-end="url(#arrow)"/>

  <rect x="390" y="972" width="420" height="68" class="box"/>
  <text x="600" y="1015" text-anchor="middle" class="text">输出成绩预测结果</text>
  <path d="M600 1040 L600 1070" class="line" marker-end="url(#arrow)"/>

  <rect x="350" y="1070" width="500" height="68" class="box"/>
  <text x="600" y="1113" text-anchor="middle" class="text">结果回流到诊断 / 问答模块</text>
</svg>
