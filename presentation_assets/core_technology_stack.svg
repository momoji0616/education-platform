<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset=".55" stop-color="#EDF6FF"/><stop offset="1" stop-color="#DCEBFF"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D7CFF"/><stop offset="1" stop-color="#0B45D9"/></linearGradient>
    <radialGradient id="bubble" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".55" stop-color="#CFE5FF" stop-opacity=".5"/><stop offset="1" stop-color="#8CB9FF" stop-opacity=".16"/></radialGradient>
    <filter id="shadow" x="-20%" y="-22%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1E3A8A" flood-opacity=".16"/></filter>
    <marker id="arrow" viewBox="0 0 14 14" refX="10.5" refY="7" markerWidth="13" markerHeight="13" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#1D6FFF"/></marker>
    <style>
      .title{font:800 64px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#07145A}.subtitle{font:500 30px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#1557D6}.card-title{font:800 33px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#07145A}.card-desc{font:500 23px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0B2A78}.pill{font:800 25px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#fff}.center{font:800 45px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#07145A}.ai-title{font:800 28px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0B45D9}.footer{font:500 27px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#17336F}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/><g opacity=".75"><circle cx="1710" cy="52" r="118" fill="url(#bubble)"/><circle cx="1810" cy="940" r="128" fill="url(#bubble)"/><circle cx="74" cy="908" r="104" fill="url(#bubble)"/><circle cx="1490" cy="160" r="55" fill="url(#bubble)"/><circle cx="1325" cy="65" r="28" fill="url(#bubble)"/></g>
  <text x="96" y="118" class="title">系统核心技术栈</text>
  <text x="100" y="176" class="subtitle">前端 + 后端 + AI 服务，构建个性化智能教育闭环</text>
  <g filter="url(#shadow)">
    <g transform="translate(120 300)"><rect width="420" height="190" rx="32" fill="#fff" stroke="#C8DDFF"/><rect x="34" y="32" width="94" height="52" rx="26" fill="url(#blue)"/><text x="81" y="67" text-anchor="middle" class="pill">前端</text><text x="165" y="74" class="card-title">Vue3 + Vite</text><text x="165" y="126" class="card-desc">教师端 / 学生端 / 管理端</text><text x="165" y="162" class="card-desc">页面交互与可视化展示</text></g>
    <g transform="translate(120 560)"><rect width="420" height="190" rx="32" fill="#fff" stroke="#C8DDFF"/><rect x="34" y="32" width="94" height="52" rx="26" fill="url(#blue)"/><text x="81" y="67" text-anchor="middle" class="pill">后端</text><text x="165" y="74" class="card-title">Spring Boot</text><text x="165" y="126" class="card-desc">用户权限 / 作业考试 / 成绩</text><text x="165" y="162" class="card-desc">业务流程与 AI 代理</text></g>
    <g transform="translate(1380 300)"><rect width="420" height="190" rx="32" fill="#fff" stroke="#C8DDFF"/><rect x="34" y="32" width="112" height="52" rx="26" fill="url(#blue)"/><text x="90" y="67" text-anchor="middle" class="pill">AI服务</text><text x="178" y="74" class="card-title">FastAPI + uv</text><text x="178" y="126" class="card-desc">RAG 问答 / 成绩预测</text><text x="178" y="162" class="card-desc">模型服务与智能分析</text></g>
    <g transform="translate(1380 560)"><rect width="420" height="190" rx="32" fill="#fff" stroke="#C8DDFF"/><rect x="34" y="32" width="112" height="52" rx="26" fill="url(#blue)"/><text x="90" y="67" text-anchor="middle" class="pill">数据层</text><text x="178" y="74" class="card-title">MySQL + Redis</text><text x="178" y="126" class="card-desc">业务数据 / 登录缓存</text><text x="178" y="162" class="card-desc">学习记录与题库数据</text></g>
  </g>
  <g transform="translate(620 270)" filter="url(#shadow)"><rect width="680" height="500" rx="42" fill="#fff" opacity=".92" stroke="#AFCBFF" stroke-width="3"/><circle cx="340" cy="78" r="42" fill="url(#blue)"/><text x="340" y="155" text-anchor="middle" class="center">AI 能力核心</text>
    <g transform="translate(70 205)"><rect width="250" height="108" rx="26" fill="#F7FBFF" stroke="#C8DDFF"/><text x="26" y="48" class="ai-title">RAG 检索</text><text x="26" y="84" class="card-desc">课程资料问答</text></g>
    <g transform="translate(360 205)"><rect width="250" height="108" rx="26" fill="#F7FBFF" stroke="#C8DDFF"/><text x="26" y="48" class="ai-title">向量知识库</text><text x="26" y="84" class="card-desc">知识片段检索</text></g>
    <g transform="translate(70 345)"><rect width="250" height="108" rx="26" fill="#F7FBFF" stroke="#C8DDFF"/><text x="26" y="48" class="ai-title">大模型生成</text><text x="26" y="84" class="card-desc">上下文回答</text></g>
    <g transform="translate(360 345)"><rect width="250" height="108" rx="26" fill="#F7FBFF" stroke="#C8DDFF"/><text x="26" y="48" class="ai-title">预测模型</text><text x="26" y="84" class="card-desc">成绩趋势预警</text></g>
  </g>
  <g fill="none" stroke="#1D6FFF" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"><path d="M540 395 H610"/><path d="M540 655 H610"/><path d="M1300 395 H1370"/><path d="M1300 655 H1370"/><path d="M960 770 V830"/></g>
  <g transform="translate(620 838)" filter="url(#shadow)"><rect width="680" height="88" rx="44" fill="#fff" stroke="#C8DDFF"/><text x="340" y="56" text-anchor="middle" class="card-title">三层协同：前端负责体验，后端负责业务，AI 服务负责智能能力</text></g>
  <rect x="250" y="970" width="1420" height="68" rx="34" fill="#fff" opacity=".85" stroke="#C8DDFF"/><text x="960" y="1015" text-anchor="middle" class="footer">核心价值：技术栈共同支撑学生学习闭环与教师教学闭环。</text>
</svg>
