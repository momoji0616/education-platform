<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1150" viewBox="0 0 2100 1150">
  <defs>
    <pattern id="smallGrid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e9edf2" stroke-width="1"/>
    </pattern>
    <pattern id="grid2" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#smallGrid2)"/>
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#dfe6ee" stroke-width="1.2"/>
    </pattern>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#9fb2c7" flood-opacity="0.28"/>
    </filter>
    <style>
      .table-title { font: 700 17px "Microsoft YaHei", SimSun, sans-serif; fill: #ffffff; }
      .field { font: 400 13px "Microsoft YaHei", Consolas, monospace; fill: #1f2937; }
      .type { fill: #9a9a9a; }
      .pk-icon { fill: #d7a018; font: 400 14px "Microsoft YaHei", sans-serif; }
      .fk-icon { fill: #bfc5cc; font: 400 14px "Microsoft YaHei", sans-serif; }
      .table-border { fill: #ffffff; stroke: #3c84c6; stroke-width: 2.8; }
      .table-head { fill: #3f86c6; }
      .line { stroke: #4b5563; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="2100" height="1150" fill="url(#grid2)"/>

  <!-- sys_user -->
  <g transform="translate(60,110)" filter="url(#shadow2)">
    <rect class="table-border" width="320" height="170" rx="18"/>
    <path class="table-head" d="M18,0 h284 a18,18 0 0 1 18,18 v32 h-320 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="160" y="31" text-anchor="middle" class="table-title">sys_user</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> user_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field">user_name <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="132" class="field">nick_name <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="159" class="field">status <tspan class="type">: char(1)</tspan></text>
  </g>

  <!-- edu_user_class_profile -->
  <g transform="translate(500,70)" filter="url(#shadow2)">
    <rect class="table-border" width="380" height="245" rx="18"/>
    <path class="table-head" d="M18,0 h344 a18,18 0 0 1 18,18 v32 h-380 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="190" y="31" text-anchor="middle" class="table-title">edu_user_class_profile</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field"><tspan class="fk-icon">◇</tspan> user_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="132" class="field">role_key <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="159" class="field">grade_no <tspan class="type">: int(0)</tspan></text>
    <text x="18" y="186" class="field">class_no <tspan class="type">: int(0)</tspan></text>
    <text x="18" y="213" class="field">class_name <tspan class="type">: varchar(255)</tspan></text>
    <text x="18" y="240" class="field">head_teacher <tspan class="type">: tinyint(1)</tspan></text>
  </g>

  <!-- edu_legacy_user_map -->
  <g transform="translate(1020,70)" filter="url(#shadow2)">
    <rect class="table-border" width="390" height="245" rx="18"/>
    <path class="table-head" d="M18,0 h354 a18,18 0 0 1 18,18 v32 h-390 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="195" y="31" text-anchor="middle" class="table-title">edu_legacy_user_map</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field"><tspan class="fk-icon">◇</tspan> current_user_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="132" class="field">legacy_student_no <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="159" class="field">legacy_class_code <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="186" class="field">map_status <tspan class="type">: char(1)</tspan></text>
    <text x="18" y="213" class="field">create_time <tspan class="type">: datetime(0)</tspan></text>
    <text x="18" y="240" class="field">remark <tspan class="type">: varchar(255)</tspan></text>
  </g>

  <!-- edu_question_bank -->
  <g transform="translate(280,450)" filter="url(#shadow2)">
    <rect class="table-border" width="420" height="320" rx="18"/>
    <path class="table-head" d="M18,0 h384 a18,18 0 0 1 18,18 v32 h-420 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="210" y="31" text-anchor="middle" class="table-title">edu_question_bank</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field">course_name <tspan class="type">: varchar(255)</tspan></text>
    <text x="18" y="132" class="field">chapter_code <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="159" class="field">chapter_name <tspan class="type">: varchar(255)</tspan></text>
    <text x="18" y="186" class="field">question_type <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="213" class="field">question_stem <tspan class="type">: longtext</tspan></text>
    <text x="18" y="240" class="field">standard_answer <tspan class="type">: longtext</tspan></text>
    <text x="18" y="267" class="field">analysis <tspan class="type">: longtext</tspan></text>
    <text x="18" y="294" class="field">knowledge_point <tspan class="type">: varchar(500)</tspan></text>
  </g>

  <!-- edu_student_answer_record -->
  <g transform="translate(880,430)" filter="url(#shadow2)">
    <rect class="table-border" width="450" height="340" rx="18"/>
    <path class="table-head" d="M18,0 h414 a18,18 0 0 1 18,18 v32 h-450 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="225" y="31" text-anchor="middle" class="table-title">edu_student_answer_record</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field">student_no <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="132" class="field"><tspan class="fk-icon">◇</tspan> question_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="159" class="field">question_type <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="186" class="field">is_correct <tspan class="type">: char(1)</tspan></text>
    <text x="18" y="213" class="field">answer_content <tspan class="type">: longtext</tspan></text>
    <text x="18" y="240" class="field">score <tspan class="type">: decimal(10,2)</tspan></text>
    <text x="18" y="267" class="field">submit_time <tspan class="type">: datetime(0)</tspan></text>
    <text x="18" y="294" class="field">source_system <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="321" class="field">source_record_id <tspan class="type">: bigint(0)</tspan></text>
  </g>

  <!-- edu_ai_interaction_log -->
  <g transform="translate(1500,420)" filter="url(#shadow2)">
    <rect class="table-border" width="460" height="340" rx="18"/>
    <path class="table-head" d="M18,0 h424 a18,18 0 0 1 18,18 v32 h-460 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="230" y="31" text-anchor="middle" class="table-title">edu_ai_interaction_log</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field"><tspan class="fk-icon">◇</tspan> user_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="132" class="field">student_no <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="159" class="field">major_key <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="186" class="field">course_name <tspan class="type">: varchar(128)</tspan></text>
    <text x="18" y="213" class="field">chapter_code <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="240" class="field">chapter_name <tspan class="type">: varchar(128)</tspan></text>
    <text x="18" y="267" class="field">knowledge_point <tspan class="type">: varchar(255)</tspan></text>
    <text x="18" y="294" class="field">question_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="321" class="field">asked_question / create_time <tspan class="type">: text / datetime(0)</tspan></text>
  </g>

  <!-- edu_ai_prediction_snapshot -->
  <g transform="translate(1540,110)" filter="url(#shadow2)">
    <rect class="table-border" width="420" height="280" rx="18"/>
    <path class="table-head" d="M18,0 h384 a18,18 0 0 1 18,18 v32 h-420 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="210" y="31" text-anchor="middle" class="table-title">edu_ai_prediction_snapshot</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field"><tspan class="fk-icon">◇</tspan> user_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="132" class="field">user_name <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="159" class="field">display_name <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="186" class="field">role_key <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="213" class="field">predicted_score <tspan class="type">: decimal(10,2)</tspan></text>
    <text x="18" y="240" class="field">score_level <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="267" class="field">create_time <tspan class="type">: datetime(0)</tspan></text>
  </g>

  <!-- edu_ai_dataset_scope -->
  <g transform="translate(70,860)" filter="url(#shadow2)">
    <rect class="table-border" width="430" height="255" rx="18"/>
    <path class="table-head" d="M18,0 h394 a18,18 0 0 1 18,18 v32 h-430 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="215" y="31" text-anchor="middle" class="table-title">edu_ai_dataset_scope</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> dataset_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field">file_name <tspan class="type">: varchar(255)</tspan></text>
    <text x="18" y="132" class="field"><tspan class="fk-icon">◇</tspan> owner_user_id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="159" class="field">owner_role_key <tspan class="type">: varchar(32)</tspan></text>
    <text x="18" y="186" class="field">owner_display_name <tspan class="type">: varchar(64)</tspan></text>
    <text x="18" y="213" class="field">scope_type / status <tspan class="type">: varchar(32) / char(1)</tspan></text>
    <text x="18" y="240" class="field">create_time / update_time <tspan class="type">: datetime(0)</tspan></text>
  </g>

  <!-- student_performance -->
  <g transform="translate(1460,850)" filter="url(#shadow2)">
    <rect class="table-border" width="430" height="245" rx="18"/>
    <path class="table-head" d="M18,0 h394 a18,18 0 0 1 18,18 v32 h-430 v-32 a18,18 0 0 1 18,-18 z"/>
    <text x="215" y="31" text-anchor="middle" class="table-title">student_performance</text>
    <text x="18" y="78" class="field"><tspan class="pk-icon">🔑</tspan> id <tspan class="type">: bigint(0)</tspan></text>
    <text x="18" y="105" class="field">hours_studied <tspan class="type">: decimal / attendance</tspan></text>
    <text x="18" y="132" class="field">previous_scores <tspan class="type">: decimal / motivation_level</tspan></text>
    <text x="18" y="159" class="field">family_income <tspan class="type">: varchar / teacher_quality</tspan></text>
    <text x="18" y="186" class="field">class_name / grade_no / class_no <tspan class="type">: varchar / int / int</tspan></text>
    <text x="18" y="213" class="field">exam_score / create_time <tspan class="type">: decimal / datetime(0)</tspan></text>
  </g>

  <!-- Clean lines -->
  <path d="M380 170 L500 170" class="line" marker-end="url(#arrow2)"/>
  <path d="M380 200 L1020 200" class="line" marker-end="url(#arrow2)"/>
  <path d="M380 230 L1540 230" class="line" marker-end="url(#arrow2)"/>
  <path d="M380 260 L380 987 L500 987" class="line" marker-end="url(#arrow2)"/>
  <path d="M700 600 L880 600" class="line" marker-end="url(#arrow2)"/>
  <path d="M1410 240 L1410 590 L1500 590" class="line" marker-end="url(#arrow2)"/>
  <path d="M1330 635 L1500 635" class="line" marker-end="url(#arrow2)"/>
</svg>
