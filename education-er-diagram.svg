<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1280" viewBox="0 0 2200 1280">
  <defs>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #222; }
      .head { font: 700 20px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #222; }
      .text { font: 500 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #222; }
      .box { fill: #ffffff; stroke: #444; stroke-width: 2.2; }
      .line { stroke: #555; stroke-width: 2.2; fill: none; }
      .label { font: 500 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #333; }
    </style>
  </defs>

  <rect width="2200" height="1280" fill="#ffffff"/>
  <text x="1100" y="46" text-anchor="middle" class="title">基于RAG的个性化智能教育辅助系统核心业务E-R图</text>

  <!-- top -->
  <rect x="120" y="110" width="320" height="190" class="box"/>
  <line x1="120" y1="150" x2="440" y2="150" class="line"/>
  <text x="280" y="136" text-anchor="middle" class="head">sys_user</text>
  <text x="145" y="183" class="text">PK user_id</text>
  <text x="145" y="213" class="text">user_name</text>
  <text x="145" y="243" class="text">nick_name</text>
  <text x="145" y="273" class="text">status</text>

  <rect x="620" y="90" width="380" height="230" class="box"/>
  <line x1="620" y1="130" x2="1000" y2="130" class="line"/>
  <text x="810" y="116" text-anchor="middle" class="head">edu_user_class_profile</text>
  <text x="645" y="163" class="text">PK user_id</text>
  <text x="645" y="193" class="text">FK user_id -&gt; sys_user.user_id</text>
  <text x="645" y="223" class="text">role_key</text>
  <text x="645" y="253" class="text">grade_no / class_no / class_name</text>
  <text x="645" y="283" class="text">head_teacher / major scope</text>

  <rect x="1160" y="90" width="390" height="230" class="box"/>
  <line x1="1160" y1="130" x2="1550" y2="130" class="line"/>
  <text x="1355" y="116" text-anchor="middle" class="head">edu_legacy_user_map</text>
  <text x="1185" y="163" class="text">PK id</text>
  <text x="1185" y="193" class="text">FK current_user_id -&gt; sys_user.user_id</text>
  <text x="1185" y="223" class="text">legacy_student_no</text>
  <text x="1185" y="253" class="text">map_status</text>
  <text x="1185" y="283" class="text">create_time / remark</text>

  <!-- middle -->
  <rect x="320" y="470" width="420" height="280" class="box"/>
  <line x1="320" y1="510" x2="740" y2="510" class="line"/>
  <text x="530" y="496" text-anchor="middle" class="head">edu_question_bank</text>
  <text x="345" y="543" class="text">PK id</text>
  <text x="345" y="573" class="text">course_name</text>
  <text x="345" y="603" class="text">chapter_code / chapter_name</text>
  <text x="345" y="633" class="text">question_type / question_stem</text>
  <text x="345" y="663" class="text">standard_answer / analysis</text>
  <text x="345" y="693" class="text">knowledge_point / difficulty_level</text>
  <text x="345" y="723" class="text">status</text>

  <rect x="900" y="450" width="460" height="310" class="box"/>
  <line x1="900" y1="490" x2="1360" y2="490" class="line"/>
  <text x="1130" y="476" text-anchor="middle" class="head">edu_student_answer_record</text>
  <text x="925" y="523" class="text">PK id</text>
  <text x="925" y="553" class="text">student_no</text>
  <text x="925" y="583" class="text">FK question_id -&gt; edu_question_bank.id</text>
  <text x="925" y="613" class="text">question_type / is_correct</text>
  <text x="925" y="643" class="text">student_answer / score</text>
  <text x="925" y="673" class="text">submit_time</text>
  <text x="925" y="703" class="text">diagnosis / recommendation source</text>

  <rect x="1520" y="470" width="430" height="260" class="box"/>
  <line x1="1520" y1="510" x2="1950" y2="510" class="line"/>
  <text x="1735" y="496" text-anchor="middle" class="head">edu_ai_prediction_snapshot</text>
  <text x="1545" y="543" class="text">PK id</text>
  <text x="1545" y="573" class="text">FK user_id -&gt; sys_user.user_id</text>
  <text x="1545" y="603" class="text">user_name / display_name / role_key</text>
  <text x="1545" y="633" class="text">predicted_score / score_level</text>
  <text x="1545" y="663" class="text">input_snapshot / prediction_message</text>
  <text x="1545" y="693" class="text">create_time</text>

  <!-- bottom -->
  <rect x="65" y="920" width="430" height="250" class="box"/>
  <line x1="65" y1="960" x2="495" y2="960" class="line"/>
  <text x="280" y="946" text-anchor="middle" class="head">edu_ai_dataset_scope</text>
  <text x="90" y="993" class="text">PK dataset_id</text>
  <text x="90" y="1023" class="text">file_name</text>
  <text x="90" y="1053" class="text">FK owner_user_id -&gt; sys_user.user_id</text>
  <text x="90" y="1083" class="text">owner_role_key / owner_display_name</text>
  <text x="90" y="1113" class="text">scope_type / status</text>
  <text x="90" y="1143" class="text">create_time / update_time</text>

  <rect x="860" y="900" width="650" height="330" class="box"/>
  <line x1="860" y1="940" x2="1510" y2="940" class="line"/>
  <text x="1185" y="926" text-anchor="middle" class="head">edu_ai_interaction_log</text>
  <text x="885" y="973" class="text">PK id</text>
  <text x="885" y="1003" class="text">FK user_id -&gt; sys_user.user_id</text>
  <text x="885" y="1033" class="text">student_no / major_key / legacy_class_code</text>
  <text x="885" y="1063" class="text">course_name / chapter_code / chapter_name</text>
  <text x="885" y="1093" class="text">knowledge_point / question_id</text>
  <text x="885" y="1123" class="text">source_scene / asked_question</text>
  <text x="885" y="1153" class="text">answer_snapshot / create_time</text>

  <rect x="1545" y="900" width="380" height="250" class="box"/>
  <line x1="1545" y1="940" x2="1925" y2="940" class="line"/>
  <text x="1735" y="926" text-anchor="middle" class="head">student_performance</text>
  <text x="1570" y="973" class="text">PK id</text>
  <text x="1570" y="1003" class="text">hours_studied / attendance</text>
  <text x="1570" y="1033" class="text">previous_scores / motivation_level</text>
  <text x="1570" y="1063" class="text">family_income / teacher_quality</text>
  <text x="1570" y="1093" class="text">class_name / grade_no / class_no</text>
  <text x="1570" y="1123" class="text">exam_score / create_time</text>

  <!-- connectors -->
  <path d="M440 205 L620 205" class="line"/>
  <text x="520" y="192" class="label">1 : 1</text>

  <path d="M440 160 L1120 160 L1120 205 L1160 205" class="line"/>
  <text x="815" y="145" class="label">1 : 1</text>

  <path d="M740 610 L900 610" class="line"/>
  <text x="810" y="598" class="label">1 : N</text>

  <path d="M1355 320 L1355 390 L1130 390 L1130 450" class="line"/>
  <text x="1160" y="378" class="label">1 : N</text>

  <path d="M1130 760 L1130 840 L1185 840 L1185 900" class="line"/>
  <text x="1155" y="828" class="label">1 : N</text>

  <path d="M280 300 L280 920" class="line"/>
  <text x="300" y="600" class="label">1 : N</text>

  <path d="M180 300 L180 400 L1735 400 L1735 470" class="line"/>
  <text x="1760" y="452" class="label">1 : N</text>

  <path d="M1735 730 L1735 900" class="line"/>
  <text x="1755" y="828" class="label">1 : N</text>
</svg>
