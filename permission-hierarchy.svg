<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 32px SimSun, "Microsoft YaHei", serif; fill: #111111; }
      .subtitle { font: 400 18px SimSun, "Microsoft YaHei", serif; fill: #333333; }
      .node-title { font: 700 22px SimSun, "Microsoft YaHei", serif; fill: #111111; }
      .node-text { font: 400 18px SimSun, "Microsoft YaHei", serif; fill: #111111; }
      .small-text { font: 400 16px SimSun, "Microsoft YaHei", serif; fill: #111111; }
      .box { fill: #ffffff; stroke: #222222; stroke-width: 2; }
      .line { stroke: #222222; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>

  <text x="80" y="80" class="title">权限层级图</text>
  <text x="80" y="115" class="subtitle">系统角色权限划分示意</text>

  <rect x="650" y="140" width="300" height="90" class="box"/>
  <text x="800" y="178" text-anchor="middle" class="node-title">系统用户</text>
  <text x="800" y="210" text-anchor="middle" class="node-text">统一登录入口</text>

  <rect x="110" y="300" width="340" height="100" class="box"/>
  <text x="280" y="342" text-anchor="middle" class="node-title">管理者</text>
  <text x="280" y="376" text-anchor="middle" class="node-text">主控端全局管理</text>

  <rect x="630" y="300" width="340" height="100" class="box"/>
  <text x="800" y="342" text-anchor="middle" class="node-title">教师</text>
  <text x="800" y="376" text-anchor="middle" class="node-text">Pad 端教学业务</text>

  <rect x="1150" y="300" width="340" height="100" class="box"/>
  <text x="1320" y="342" text-anchor="middle" class="node-title">学生</text>
  <text x="1320" y="376" text-anchor="middle" class="node-text">Pad 端学习业务</text>

  <rect x="70" y="520" width="420" height="260" class="box"/>
  <text x="280" y="564" text-anchor="middle" class="node-title">管理者权限</text>
  <text x="280" y="610" text-anchor="middle" class="small-text">查看全局班级与成绩数据</text>
  <text x="280" y="648" text-anchor="middle" class="small-text">管理教师与学生账号</text>
  <text x="280" y="686" text-anchor="middle" class="small-text">发布任务与查看汇总信息</text>
  <text x="280" y="724" text-anchor="middle" class="small-text">进入 Pad 端入口</text>

  <rect x="590" y="520" width="420" height="260" class="box"/>
  <text x="800" y="564" text-anchor="middle" class="node-title">教师权限</text>
  <text x="800" y="610" text-anchor="middle" class="small-text">布置作业与考试</text>
  <text x="800" y="648" text-anchor="middle" class="small-text">查看学生成绩与学情分析</text>
  <text x="800" y="686" text-anchor="middle" class="small-text">智能组卷与教学辅助</text>
  <text x="800" y="724" text-anchor="middle" class="small-text">成绩预测与 RAG 智能问答</text>

  <rect x="1110" y="520" width="420" height="260" class="box"/>
  <text x="1320" y="564" text-anchor="middle" class="node-title">学生权限</text>
  <text x="1320" y="610" text-anchor="middle" class="small-text">查看作业与考试</text>
  <text x="1320" y="648" text-anchor="middle" class="small-text">完成练习、刷题与诊断</text>
  <text x="1320" y="686" text-anchor="middle" class="small-text">查看个人成绩与学习规划</text>
  <text x="1320" y="724" text-anchor="middle" class="small-text">成绩预测与 RAG 智能问答</text>

  <line x1="800" y1="230" x2="280" y2="300" class="line" marker-end="url(#arrow)"/>
  <line x1="800" y1="230" x2="800" y2="300" class="line" marker-end="url(#arrow)"/>
  <line x1="800" y1="230" x2="1320" y2="300" class="line" marker-end="url(#arrow)"/>

  <line x1="280" y1="400" x2="280" y2="520" class="line" marker-end="url(#arrow)"/>
  <line x1="800" y1="400" x2="800" y2="520" class="line" marker-end="url(#arrow)"/>
  <line x1="1320" y1="400" x2="1320" y2="520" class="line" marker-end="url(#arrow)"/>
</svg>
