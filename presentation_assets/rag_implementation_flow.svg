<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset=".55" stop-color="#EDF6FF"/><stop offset="1" stop-color="#DCEBFF"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D7CFF"/><stop offset="1" stop-color="#0B45D9"/></linearGradient>
    <radialGradient id="bubble" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".55" stop-color="#CFE5FF" stop-opacity=".5"/><stop offset="1" stop-color="#8CB9FF" stop-opacity=".16"/></radialGradient>
    <filter id="shadow" x="-20%" y="-22%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1E3A8A" flood-opacity=".16"/></filter>
    <marker id="arrow" viewBox="0 0 14 14" refX="10.5" refY="7" markerWidth="13" markerHeight="13" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#1D6FFF"/></marker>
    <style>
      .title{font:800 64px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#07145A}.subtitle{font:500 30px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#1557D6}.lane{font:800 29px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0B45D9}.node-title{font:800 31px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#07145A}.node-desc{font:500 23px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0B2A78}.num{font:900 30px "Microsoft YaHei",Arial,sans-serif;fill:#fff}.center{font:800 40px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#07145A}.center-sub{font:500 24px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#264B91}.footer{font:500 27px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#17336F}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/><g opacity=".75"><circle cx="95" cy="32" r="92" fill="url(#bubble)"/><circle cx="1810" cy="48" r="118" fill="url(#bubble)"/><circle cx="1880" cy="900" r="116" fill="url(#bubble)"/><circle cx="64" cy="910" r="104" fill="url(#bubble)"/><circle cx="1650" cy="190" r="30" fill="url(#bubble)"/><circle cx="238" cy="1015" r="38" fill="url(#bubble)"/></g>
  <text x="96" y="118" class="title">基于 RAG 的智能问答实现流程</text>
  <text x="100" y="176" class="subtitle">资料入库 + 相似检索 + 上下文增强 + 大模型生成，让回答更贴合课程与学生画像</text>
  <rect x="110" y="242" width="760" height="58" rx="29" fill="#DBEAFE" stroke="#AFCBFF"/><text x="490" y="281" text-anchor="middle" class="lane">知识库构建阶段</text>
  <rect x="1050" y="242" width="760" height="58" rx="29" fill="#DBEAFE" stroke="#AFCBFF"/><text x="1430" y="281" text-anchor="middle" class="lane">智能问答阶段</text>
  <g filter="url(#shadow)">
    <g transform="translate(220 405)"><rect x="-88" y="-70" width="310" height="140" rx="28" fill="#fff" stroke="#C8DDFF"/><circle cx="-42" cy="-30" r="31" fill="url(#blue)"/><text x="-42" y="-19" text-anchor="middle" class="num">1</text><text x="8" y="-24" class="node-title">资料上传</text><text x="8" y="25" class="node-desc">课程资料 / 题库</text></g>
    <g transform="translate(560 405)"><rect x="-88" y="-70" width="310" height="140" rx="28" fill="#fff" stroke="#C8DDFF"/><circle cx="-42" cy="-30" r="31" fill="url(#blue)"/><text x="-42" y="-19" text-anchor="middle" class="num">2</text><text x="8" y="-24" class="node-title">文本切分</text><text x="8" y="25" class="node-desc">清洗并拆成片段</text></g>
    <g transform="translate(390 655)"><rect x="-88" y="-70" width="310" height="140" rx="28" fill="#fff" stroke="#C8DDFF"/><circle cx="-42" cy="-30" r="31" fill="url(#blue)"/><text x="-42" y="-19" text-anchor="middle" class="num">3</text><text x="8" y="-24" class="node-title">向量化入库</text><text x="8" y="25" class="node-desc">写入向量知识库</text></g>
    <g transform="translate(760 655)"><rect x="-88" y="-70" width="310" height="140" rx="28" fill="#fff" stroke="#C8DDFF"/><circle cx="-42" cy="-30" r="31" fill="url(#blue)"/><text x="-42" y="-19" text-anchor="middle" class="num">4</text><text x="8" y="-24" class="node-title">元数据记录</text><text x="8" y="25" class="node-desc">来源与文件可追踪</text></g>
    <g transform="translate(1130 405)"><rect x="-88" y="-70" width="310" height="140" rx="28" fill="#fff" stroke="#C8DDFF"/><circle cx="-42" cy="-30" r="31" fill="url(#blue)"/><text x="-42" y="-19" text-anchor="middle" class="num">5</text><text x="8" y="-24" class="node-title">用户提问</text><text x="8" y="25" class="node-desc">携带学习上下文</text></g>
    <g transform="translate(1470 405)"><rect x="-88" y="-70" width="310" height="140" rx="28" fill="#fff" stroke="#C8DDFF"/><circle cx="-42" cy="-30" r="31" fill="url(#blue)"/><text x="-42" y="-19" text-anchor="middle" class="num">6</text><text x="8" y="-24" class="node-title">相似检索</text><text x="8" y="25" class="node-desc">召回相关知识片段</text></g>
    <g transform="translate(1255 655)"><rect x="-88" y="-70" width="310" height="140" rx="28" fill="#fff" stroke="#C8DDFF"/><circle cx="-42" cy="-30" r="31" fill="url(#blue)"/><text x="-42" y="-19" text-anchor="middle" class="num">7</text><text x="8" y="-24" class="node-title">上下文拼接</text><text x="8" y="25" class="node-desc">资料片段 + 学生画像</text></g>
    <g transform="translate(1635 655)"><rect x="-88" y="-70" width="310" height="140" rx="28" fill="#fff" stroke="#C8DDFF"/><circle cx="-42" cy="-30" r="31" fill="url(#blue)"/><text x="-42" y="-19" text-anchor="middle" class="num">8</text><text x="8" y="-24" class="node-title">大模型生成</text><text x="8" y="25" class="node-desc">输出可信回答</text></g>
  </g>
  <g transform="translate(960 535)" filter="url(#shadow)"><rect x="-160" y="-95" width="320" height="190" rx="34" fill="#fff" opacity=".92" stroke="#AFCBFF"/><circle cx="0" cy="-28" r="34" fill="url(#blue)"/><text y="33" text-anchor="middle" class="center">RAG 核心</text><text y="70" text-anchor="middle" class="center-sub">检索增强生成</text></g>
  <g fill="none" stroke="#1D6FFF" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"><path d="M444 405 H492"/><path d="M618 475 C575 545 510 600 465 625"/><path d="M613 655 H672"/><path d="M968 655 H1160"/><path d="M1350 405 H1398"/><path d="M1518 475 C1480 545 1395 595 1320 624"/><path d="M1478 655 H1548"/></g>
  <rect x="250" y="970" width="1420" height="68" rx="34" fill="#fff" opacity=".85" stroke="#C8DDFF"/>
  <text x="960" y="1015" text-anchor="middle" class="footer">关键价值：回答不只依赖大模型记忆，而是优先引用课程资料、题库与当前学生画像。</text>
</svg>
